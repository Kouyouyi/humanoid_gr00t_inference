[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gr00t-real-inference"
version = "0.1.0"
description = "Standalone G1 GR00T inference, body owner, first-person preview and recording"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.setuptools]
py-modules = ["run_real_vla", "vla_camera_view", "runtime_config"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
